<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otaku Trivia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@400;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=5">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.2.0/css/line.css" />
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.2.0/css/thinline.css" />

</head>

<body>
    <div id="app-container"></div>
    <div id="toast-container"></div>

    <div id="audio-control-container">
        <div id="audio-panel" onmouseenter="clearAudioPanelTimeout()" onmouseleave="startAudioPanelTimeout()"
            ontouchstart="clearAudioPanelTimeout()" ontouchend="startAudioPanelTimeout()">
            <label>SFX Volume</label>
            <input type="range" id="sfx-vol" min="0" max="100" value="100" oninput="updateSFXVol(this.value)">
            <label>Music Volume</label>
            <input type="range" id="bgm-vol" min="0" max="100" value="100" oninput="updateBGMVol(this.value)">
        </div>
        <div id="audio-icon" onclick="toggleAudioPanel()">
            <i class="uil uil-volume"></i>
        </div>
    </div>

    <script src="app.js?v=8"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, getDocs, serverTimestamp, doc, setDoc, updateDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-analytics.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-functions.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDqau1zWiT64Tl10vuL55C0kMISktjTLYU",
            authDomain: "anime-trivia-f8e36.firebaseapp.com",
            projectId: "anime-trivia-f8e36",
            storageBucket: "anime-trivia-f8e36.firebasestorage.app",
            messagingSenderId: "580827563128",
            appId: "1:580827563128:web:2757303ef5b30beafbd98d",
            measurementId: "G-22FS3H63C8"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // Attach to window so app.js can use them
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.onSnapshot = onSnapshot;
        window.query = query;
        window.orderBy = orderBy;
        window.limit = limit;
        window.getDocs = getDocs;
        window.serverTimestamp = serverTimestamp;
        window.doc = doc;
        window.setDoc = setDoc;
        window.updateDoc = updateDoc;
        window.getDoc = getDoc;
        window.deleteDoc = deleteDoc;
        
        const functions = getFunctions(app, "us-central1");
        window.functions = functions;
        window.httpsCallable = httpsCallable;

        // 3. NOW start the game, because Firebase is completely ready!
        initDB();
        render();
    </script>
</body>

</html>
